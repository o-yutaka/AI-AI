[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-control-plane"
version = "0.5.0"
description = "Contract-aware, auditable AI agent control-plane reference implementation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "o-yutaka" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10.0",
  "ruff>=0.6,<1.0",
]

[project.urls]
Homepage = "https://github.com/o-yutaka/AI-AI"
Repository = "https://github.com/o-yutaka/AI-AI"
Documentation = "https://github.com/o-yutaka/AI-AI#readme"
"Live Demo" = "https://raw.githack.com/o-yutaka/AI-AI/main/docs/live-demo.html"

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
