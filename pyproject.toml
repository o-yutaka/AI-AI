[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-ai-agent-security-lab"
version = "0.6.0"
description = "Independent Kaggle AI-agent tool-security research, replay, evaluation, and canonical evidence export lab"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "o-yutaka" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "ruff>=0.6,<1.0",
]

[project.urls]
Homepage = "https://github.com/o-yutaka/kaggle-ai-agent-security-lab"
Repository = "https://github.com/o-yutaka/kaggle-ai-agent-security-lab"
Documentation = "https://github.com/o-yutaka/kaggle-ai-agent-security-lab#readme"

[tool.setuptools.packages.find]
include = ["control_plane*", "research_bundle*", "security_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
