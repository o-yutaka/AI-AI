services:
  api:
    build: .
    environment:
      CORS_ORIGINS: http://localhost:3000
      AGENT_DB_PATH: /data/control-plane.sqlite3
    volumes:
      - agent_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  agent_data:
