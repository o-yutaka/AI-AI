name: generate-proof-assets

on:
  push:
    branches:
      - feature/portfolio-proof-complete-20260801
    paths-ignore:
      - "requirements.lock.txt"
      - "requirements.runtime.lock.txt"
      - "web/package-lock.json"
      - "docs/assets/proof/**"
  pull_request:
    paths:
      - "docs/live-demo.html"
      - "scripts/capture_visual_proof.py"
      - "web/app/**"
      - "web/package.json"
      - "web/next.config.*"
      - "web/tsconfig.json"
      - "pyproject.toml"
      - ".github/workflows/generate-proof-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate frontend lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact Python dependency locks
        run: |
          python -m venv /tmp/ai-ai-runtime-lock
          /tmp/ai-ai-runtime-lock/bin/python -m pip install --upgrade pip
          /tmp/ai-ai-runtime-lock/bin/pip install -e .
          /tmp/ai-ai-runtime-lock/bin/pip freeze --exclude-editable | LC_ALL=C sort > requirements.runtime.lock.txt

          python -m venv /tmp/ai-ai-dev-lock
          /tmp/ai-ai-dev-lock/bin/python -m pip install --upgrade pip
          /tmp/ai-ai-dev-lock/bin/pip install -e ".[dev]"
          /tmp/ai-ai-dev-lock/bin/pip freeze --exclude-editable | LC_ALL=C sort > requirements.lock.txt

          test -s requirements.runtime.lock.txt
          test -s requirements.lock.txt
      - uses: actions/upload-artifact@v4
        with:
          name: generated-lockfiles
          path: |
            web/package-lock.json
            requirements.runtime.lock.txt
            requirements.lock.txt
          if-no-files-found: error

  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Start local proof server
        run: |
          python -m http.server 4173 --directory docs > /tmp/ai-ai-proof-server.log 2>&1 &
          echo $! > /tmp/ai-ai-proof-server.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/live-demo.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-ai-proof-server.log
          exit 1
      - name: Verify interactions and capture proof
        run: >-
          python scripts/capture_visual_proof.py
          --url http://127.0.0.1:4173/live-demo.html
          --output docs/assets/proof
      - name: Stop local proof server
        if: always()
        run: |
          if [ -f /tmp/ai-ai-proof-server.pid ]; then
            kill "$(cat /tmp/ai-ai-proof-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: visual-proof-assets
          path: docs/assets/proof
          if-no-files-found: error

  commit-generated:
    if: github.event_name == 'push'
    needs: [lockfiles, visual-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: generated-lockfiles
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: visual-proof-assets
          path: docs/assets/proof
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt requirements.runtime.lock.txt web/package-lock.json docs/assets/proof
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Commit generated lockfiles and visual proof [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
