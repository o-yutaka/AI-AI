name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - name: Install locked dependencies
        run: |
          pip install -r requirements.lock.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check . --diff
      - name: Tests
        run: pytest -q
      - name: Package and CLI smoke
        run: |
          python -c "import control_plane, research_bundle, security_lab"
          kaggle-security-lab --help >/dev/null
          kaggle-security-lab plan-budget 100 >/tmp/kaggle-budget.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/kaggle-budget.json', encoding='utf-8'))
          assert payload['total_units'] == 100
          assert payload['evaluator_identification'] == 25
          assert payload['falsification'] == 25
          assert payload['optimization'] == 35
          assert payload['portfolio_validation'] == 15
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build GitHub Pages demo
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build
      - name: Verify static artifact
        run: test -f out/index.html
